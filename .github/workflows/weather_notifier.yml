name: Daily Rain Notification

on:
  schedule:
    # 每天台灣時間 07:00 執行 (UTC 時間 23:00)
    - cron: '0 23 * * *'
  # 支援在 GitHub 介面上手動點擊觸發測試
  workflow_dispatch:

jobs:
  check-rain-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 執行降雨偵測與通知腳本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
